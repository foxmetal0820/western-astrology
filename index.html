<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>西洋占星術 自動計算</title><style>body{font-family:system-ui,sans-serif;background:#101522;color:#f6e7c3;margin:0;padding:20px}main{max-width:750px;margin:auto}h1{color:#e6bd65}label{display:block;margin:14px 0 5px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:9px;border:1px solid #9c8558;font-size:16px}button{background:#d7ae59;color:#111;font-weight:bold;margin-top:20px}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:10px 6px;border-bottom:1px solid #615334;text-align:left}small,p{line-height:1.6}#status{margin-top:16px}</style></head><body><main><h1>✦ 西洋占星術 自動計算</h1><p>出生日時と出生地の緯度・経度を入力してください。時刻は日本標準時（JST）です。</p><label>生年月日</label><input id="date" type="date" value="1977-08-20"><label>出生時刻</label><input id="time" type="time" value="16:45"><label>出生地（メモ用）</label><input id="place" value="大阪府八尾市"><label>緯度（北緯）</label><input id="lat" type="number" step="any" value="34.6269"><label>経度（東経）</label><input id="lon" type="number" step="any" value="135.6009"><button id="go">天体配置を計算</button><p id="status" role="status"></p><div id="result"></div><small>計算方式：熱帯黄道・地心黄経、ハウスはホールサイン方式。出生地は自動座標変換されません。日本国外や歴史的な夏時間には未対応です。天体暦ライブラリをインターネットから読み込みます。鑑定の参考用です。</small></main><script type="module">
import * as A from 'https://esm.sh/astronomy-engine@2.1.19';
const signs=['牡羊座','牡牛座','双子座','蟹座','獅子座','乙女座','天秤座','蠍座','射手座','山羊座','水瓶座','魚座'];
const bodies=[['太陽','Sun'],['月','Moon'],['水星','Mercury'],['金星','Venus'],['火星','Mars'],['木星','Jupiter'],['土星','Saturn'],['天王星','Uranus'],['海王星','Neptune'],['冥王星','Pluto']];
const norm=x=>(x%360+360)%360;const rad=x=>x*Math.PI/180;const deg=x=>x*180/Math.PI;
function position(lon){let x=norm(lon);return `${signs[Math.floor(x/30)]} ${(x%30).toFixed(2)}°`}
function ascMc(date,lat,lon){let t=new A.AstroTime(date);let theta=rad(norm(A.SiderealTime(t)*15+lon));let eps=rad(23.439291);let phi=rad(lat);let asc=norm(deg(Math.atan2(-Math.cos(theta),Math.sin(theta)*Math.cos(eps)+Math.tan(phi)*Math.sin(eps))));let mc=norm(deg(Math.atan2(Math.sin(theta),Math.cos(theta)*Math.cos(eps))));return {asc,mc}}
function eclipticLongitude(body,time){if(body==='Sun')return norm(A.SunPosition(time).elon);let v=A.GeoVector(body,time,true);return norm(A.Ecliptic(v).elon)}
const $=id=>document.getElementById(id);
$('go').onclick=()=>{try{let date=$('date').value,clock=$('time').value,lat=Number($('lat').value),lon=Number($('lon').value);if(!date||!clock||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)throw Error('入力値を確認してください');let utc=new Date(`${date}T${clock}:00+09:00`);if(Number.isNaN(utc.getTime()))throw Error('日時が正しくありません');let time=new A.AstroTime(utc),{asc,mc}=ascMc(utc,lat,lon);let ascSign=Math.floor(asc/30);let rows=bodies.map(([name,body])=>{let e=eclipticLongitude(body,time);let house=(Math.floor(e/30)-ascSign+12)%12+1;return `<tr><td>${name}</td><td>${position(e)}</td><td>${house}室</td></tr>`}).join('');$('result').innerHTML=`<h2>計算結果</h2><p>ASC：${position(asc)}<br>MC：${position(mc)}</p><table><thead><tr><th>天体</th><th>星座・度数</th><th>ハウス</th></tr></thead><tbody>${rows}</tbody></table>`;$('status').textContent='計算が完了しました';}catch(e){$('status').textContent='計算できませんでした：'+e.message;}};
</script></body></html>
